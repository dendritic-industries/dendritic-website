<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dendritic Industries</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Bahnschrift', 'DIN DIN', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      /* Supports variable weights from 200 to 900 */
      font-style: normal;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .tagline {
      position: absolute;
      top: 2rem;
      left: 2.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-align: right;
      line-height: 1.6;
      /* opacity: 0.75; */
    }

    .tagline img {
      height: 5rem;
    }

    .slogan {
      font-size: 1.2rem;
      letter-spacing: 0.05em;
    }

    .location {
      position: absolute;
      bottom: 2rem;
      left: 1rem;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="tagline"><img src="dendritic_logo_inverted.png" alt="Dendritic Industries Logo"></div>
    <div class="navbar">
      
    </div>
  </div>

  <div class="slogan">The hardest parts — from the ground up</div>

  <div class="location">
    <div>Dendritic Industries, Inc.</div>
    <div>7371 Thomas Boulevard</div>
    <div>Pittsburgh, Pennsylvania, USA</div>
  </div>
</body>

</html>
